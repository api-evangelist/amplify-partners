aid: amplify-partners
name: Amplify Partners
description: >-
  Amplify Partners is an early-stage venture capital firm founded in 2012 and
  headquartered in Menlo Park, California, with a second office in San Francisco.
  Amplify positions itself as "the first investor for technical founders" —
  engineers, researchers, and scientists who have felt a problem viscerally and
  are compelled to spend a decade solving it. The firm invests primarily at the
  seed and Series A stages, with check sizes generally ranging from roughly $1M
  to $10M (often around $3M at seed), and continues to back companies through
  growth and IPO. Its thesis concentrates on deep technical categories:
  developer tools and computing infrastructure, machine learning and artificial
  intelligence, data and analytics, cybersecurity, and digital biology. In June
  2025 Amplify announced roughly $900M in new capital across three vehicles —
  Fund 6, Fund 6 Select, and Amplify Bio. Notable portfolio companies include
  Datadog, Fastly, dbt Labs, Temporal, Chainguard, LangChain, Runway, and
  Recursion.
